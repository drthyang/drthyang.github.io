<!-- start custom head snippets -->

{% if page.url == '/publications/' %}
{%- assign pubs = site.data.publications | sort: "date" | reverse -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "name": "Publications by Tsung-Han Yang",
  "itemListElement": [
    {%- for p in pubs %}
    {
      "@type": "ListItem",
      "position": {{ forloop.index }},
      "item": {
        "@type": "ScholarlyArticle",
        "headline": {{ p.title | strip_html | jsonify }},
        "author": [
          {%- assign names = p.authors | replace: ", and ", ", " | replace: " and ", ", " | split: ", " -%}
          {%- for n in names %}
          {% if n == "T.-H. Yang" %}{ "@type": "Person", "name": "Tsung-Han Yang", "url": {{ '/' | absolute_url | jsonify }} }{% else %}{ "@type": "Person", "name": {{ n | strip | jsonify }} }{% endif %}{% unless forloop.last %},{% endunless %}
          {%- endfor %}
        ],
        "datePublished": {{ p.date | date: "%Y-%m-%d" | jsonify }},
        "description": {{ p.venue | jsonify }}
        {%- if p.links.doi != "" -%},
        "url": {{ "https://doi.org/" | append: p.links.doi | jsonify }},
        "identifier": { "@type": "PropertyValue", "propertyID": "DOI", "value": {{ p.links.doi | jsonify }} }
        {%- elsif p.links.arxiv != "" -%},
        "url": {{ "https://arxiv.org/abs/" | append: p.links.arxiv | jsonify }}
        {%- endif %}
        {%- if p.links.doi != "" and p.links.arxiv != "" -%},
        "sameAs": {{ "https://arxiv.org/abs/" | append: p.links.arxiv | jsonify }}
        {%- endif %}
      }
    }{% unless forloop.last %},{% endunless %}
    {%- endfor %}
  ]
}
</script>
{% endif %}

<!-- end custom head snippets -->
