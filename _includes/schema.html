{% comment %}
  Replaces the theme's schema.html (included on the homepage only).
  Person data for search engines and AI answer engines. ORNL appears only as
  employer; the personal software projects are not tied to it here.
{% endcomment %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "@id": {{ '/#person' | absolute_url | jsonify }},
  "name": "Tsung-Han Yang",
  "alternateName": ["T.-H. Yang", "Tsung-Han Yang, Ph.D."],
  "honorificSuffix": "Ph.D.",
  "url": {{ '/' | absolute_url | jsonify }},
  "image": {{ site.author.avatar | absolute_url | jsonify }},
  "description": {{ site.description | jsonify }},
  "jobTitle": "Postdoctoral Researcher",
  "worksFor": {
    "@type": "Organization",
    "name": "Oak Ridge National Laboratory",
    "url": "https://www.ornl.gov"
  },
  "alumniOf": {
    "@type": "CollegeOrUniversity",
    "name": "Brown University"
  },
  "knowsAbout": [
    "AI for Science",
    "LLM agents",
    "Neutron scattering",
    "X-ray scattering",
    "Pair distribution function analysis",
    "Reverse Monte Carlo modeling",
    "Rietveld and magnetic structure refinement",
    "Diffuse scattering",
    "Quantum materials",
    "Kagome magnets",
    "Scientific software"
  ],
  "sameAs": [
    {%- assign profile_links = site.author.links | where_exp: "l", "l.url contains 'https://'" -%}
    {%- for link in profile_links %}
    {{ link.url | jsonify }}{% unless forloop.last %},{% endunless %}
    {%- endfor %}
  ]
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ site.title | jsonify }},
  "url": {{ '/' | absolute_url | jsonify }},
  "author": { "@id": {{ '/#person' | absolute_url | jsonify }} }
}
</script>
