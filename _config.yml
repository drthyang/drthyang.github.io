# Site Settings
title: "Tsung-Han Yang"  # Keeps the browser tab clean
masthead_title: "Research Portfolio <br> <span style='font-size:0.7em; font-weight:normal;'>AI for Science • Quantum Physicist • Materials Scientist</span>"
name: "Tsung-Han Yang, Ph.D."
# No "|" in descriptions: the theme runs them through Markdown, which turns pipes into a table.
description: "Tsung-Han Yang, Ph.D.: AI for Science and materials physics. LLM agents, scattering data analysis, and browser-based scientific software. Postdoctoral researcher at ORNL."
og_image: "/assets/images/Tsung-Han_photo.png"

# Search engine verification (Google Search Console, Bing Webmaster Tools).
# Paste the content="..." value of each service's HTML-tag method.
# google_site_verification: ""
# bing_site_verification: ""
url: "https://drthyang.github.io"
baseurl: ""

permalink: pretty

# Keep internal notes and helper scripts out of the public build.
# Jekyll 3.x replaces (not extends) the default list, so the defaults are repeated here.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - AGENTS.md
  - CLAUDE.md
  - TODO.md
  - improvement-plans/
  - fix_ssl.rb
  - preview_cmd

# Read CSS
custom_css:
  - /assets/css/custom.css

# Theme Settings
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: dark 

# Technical Plugins
plugins:
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from

# Site Author Settings (This populates the sidebar)
author:
  name: "Tsung-Han Yang"
  avatar: "/assets/images/Tsung-Han_photo.png" 
  bio: "Postdoctoral Researcher @ ORNL <br> PhD in Physics @ Brown University"
  location: "Knoxville, TN"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:thyang.careers@gmail.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/drthyang"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=oMIW2moAAAAJ&hl=en"
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0000-0003-0186-302X"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/thyang-profile"

# Defaults for Layouts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: single
      author_profile: true # Keeps your bio visible on every post
      read_time: true
      comments: false
      share: true
      related: true
  - scope:
      path: ""
      type: "pages"
    values:
      layout: single
      author_profile: true # This fills the empty space on the left!
  # Verification files stay served but out of the sitemap.
  - scope:
      path: "google*.html"
    values:
      sitemap: false

# Navigation Links (Top Header)
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/drthyang"
